# Configuración del Puerto del Servidor (Railway asigna un puerto dinámico automáticamente)
server.port=${PORT:8080}

# Conexión a la Base de Datos MySQL usando las variables de entorno de Railway
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Thymeleaf para desarrollo (desactiva el caché local)
spring.thymeleaf.cache=false



